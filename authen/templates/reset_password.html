{% extends 'main.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/reset_password.css' %}">
{% endblock %}

{% block content %}

<div class="reset-password-container">

    <div class="reset-password-card">

        <h1>Reset Password</h1>

        {% if messages %}
            {% for i in messages %}
                <p class="message">{{ i }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input type="hidden" name="reset_password" value="true">
            <input type="hidden" name="uname" value="{{ user.username }}">

            <div class="form-group">
                <label>New Password</label>

                <input
                    type="password"
                    name="new_pasw"
                    id="reset-password"
                    placeholder="Enter New Password"
                    minlength="8"
                    required
                >

                <button
                    type="button"
                    onclick="togglePassword('reset-password', this)"
                >
                    Show
                </button>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>

                <input
                    type="password"
                    name="confirm_pasw"
                    id="reset-confirm-password"
                    placeholder="Confirm New Password"
                    minlength="8"
                    required
                >

                <button
                    type="button"
                    onclick="togglePassword('reset-confirm-password', this)"
                >
                    Show
                </button>
            </div>

            <button type="submit">Reset Password</button>

        </form>

        <a href="{% url 'login_' %}" class="back-login">
            Back to Login
        </a>

    </div>

</div>

<script src="{% static 'js/password.js' %}"></script>

{% endblock %}
