<nav>

    <div class="logo">
        <h2>ShopSphere</h2>
    </div>

    <div class="links">

        {% if user.is_authenticated %}

            <form action="">
                <input type="text" name="q" placeholder="Search..">
                <button type="submit">Search</button>
            </form>

            <form action="">
                <input type="submit" value="Trending" name="trending" class="{% if trend %}active-filter{% endif %}"
                >
                
            </form>

            <form action="">
                <input type="submit" value="Offer" name="offer" class="{% if offer %}active-filter{% endif %}"
                >
            </form>

            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'cart' %}">Cart</a>
            <a href="{% url 'profile' %}">Profile</a>
            <a href="{% url 'logout' %}">Logout</a>
            <a href="{% url 'support' %}">Support</a>
            <a href="{% url 'know_us' %}">Know us</a>

        {% else %}

            <a href="{% url 'login_' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
            <a href="{% url 'support' %}">Support</a>
            <a href="{% url 'know_us' %}">Know us</a>

        {% endif %}

    </div>

</nav>

<center>

    <div>

        {% for c in category %}

            <a href="/?cat={{ c }}">
                <button>{{ c }}</button>
            </a>

        {% endfor %}

    </div>

</center>
